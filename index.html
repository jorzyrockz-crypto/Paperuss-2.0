  <style>
    body {
      transition: opacity 0.26s cubic-bezier(0.4, 0, 0.2, 1), transform 0.26s cubic-bezier(0.16, 1, 0.3, 1), filter 0.26s ease;
    }
    body.page-exiting {
      opacity: 0 !important;
      transform: scale(0.985);
      filter: blur(4px);
      pointer-events: none;
    }
  </style>
  <script>
    (() => {
      let isNavigating = false;
      const openApp = (query = '') => {
        if (isNavigating) return;
        isNavigating = true;
        document.body.classList.add('page-exiting');
        setTimeout(() => {
          window.location.href = `app.html${query}`;
        }, 220);
      };

      document.addEventListener('click', event => {
        const button = event.target.closest('button');
        const buttonText = button?.textContent?.replace(/\s+/g, ' ').trim() || '';
        if (button && (buttonText === 'Get PapeRuss' || buttonText.includes('Create your first note'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
          openApp();
          return;
        }
        if (button && buttonText === 'View changelog') {
          event.preventDefault();
          event.stopImmediatePropagation();
          openApp('?changelog=1');
          return;
        }
        const headerItem = event.target.closest('header span');
        const headerText = headerItem?.textContent?.trim();
        if (headerText === 'Library' || headerText === 'Branches') {
          event.preventDefault();
          openApp();
          return;
        } else if (headerText === 'Leafline') {
          event.preventDefault();
          document.getElementById('leafline')?.scrollIntoView({ behavior: 'smooth' });
          return;
        }
        const footerItem = event.target.closest('footer span');
        const footerText = footerItem?.textContent?.trim();
        if (footerText === 'Changelog') {
          event.preventDefault();
          openApp('?changelog=1');
          return;
        } else if (footerText === 'GitHub') {
          event.preventDefault();
          window.open('https://github.com/jorzyrockz-crypto/Paperuss-2.0', '_blank');
          return;
        }
      }, true);
    })();
  </script>
